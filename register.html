<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Conta • FinPulse Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Barra Superior Minimalista -->
  <header class="border-b border-slate-800/80 px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="login.html" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
          </svg>
        </div>
        <span class="text-lg font-bold tracking-tight text-white">FinPulse <span class="text-indigo-400 font-semibold">Analytics</span></span>
      </a>
      <a href="login.html" class="text-xs sm:text-sm font-medium text-slate-300 hover:text-white transition">
        Já possui conta? <span class="text-indigo-400 font-semibold">Fazer login</span>
      </a>
    </div>
  </header>

  <!-- Card Central de Registro -->
  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
      <div class="px-8 pt-8 pb-6 border-b border-slate-100">
        <span class="inline-flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wider bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full">
          Onboarding Empresarial
        </span>
        <h1 class="text-2xl font-bold text-slate-900 mt-3">Criar Conta Corporativa</h1>
        <p class="text-xs text-slate-500 mt-1">Cadastre sua organização para configurar a integração de API e acompanhar a DRE.</p>
      </div>

      <form id="formRegistro" onsubmit="registrarConta(event)" class="p-8 space-y-4">
        <div id="alertaRegistro" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs px-3.5 py-2.5 rounded-lg"></div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="regNome" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Seu Nome Completo</label>
            <input type="text" id="regNome" required placeholder="Ex.: Mateus Rocha" class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition" />
          </div>
          <div>
            <label for="regEmpresa" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Empresa / Organização</label>
            <input type="text" id="regEmpresa" required placeholder="Ex.: GeoTop Engenharia" class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition" />
          </div>
        </div>

        <div>
          <label for="regEmail" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">E-mail Corporativo</label>
          <input type="email" id="regEmail" required placeholder="financeiro@suaempresa.com.br" class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="regSenha" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Senha (mín. 8 caracteres)</label>
            <input type="password" id="regSenha" required minlength="8" placeholder="••••••••" class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition" />
          </div>
          <div>
            <label for="regConfirmarSenha" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Confirmar Senha</label>
            <input type="password" id="regConfirmarSenha" required minlength="8" placeholder="••••••••" class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition" />
          </div>
        </div>

        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-xs text-slate-600 flex items-start gap-2.5">
          <input type="checkbox" id="irParaApi" checked class="mt-0.5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" />
          <label for="irParaApi" class="cursor-pointer">
            Continuar diretamente para a <strong>Configuração de API</strong> após criar a conta para conectar minha base de dados ou ERP.
          </label>
        </div>

        <button type="submit" id="btnRegistrar" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-2.5 px-4 rounded-lg transition shadow-md shadow-indigo-600/20">
          Criar Conta e Continuar
        </button>

        <div class="pt-3 border-t border-slate-100 text-center text-xs text-slate-500">
          Já tem uma conta cadastrada?
          <a href="login.html" class="text-indigo-600 hover:text-indigo-800 font-semibold ml-1">Entrar agora</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-900">
    FinPulse Analytics • Controladoria &amp; Inteligência Financeira
  </footer>

  <script>
    function registrarConta(event) {
      event.preventDefault();
      const nome = document.getElementById('regNome').value.trim();
      const empresa = document.getElementById('regEmpresa').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const senha = document.getElementById('regSenha').value;
      const confirmar = document.getElementById('regConfirmarSenha').value;
      const irParaApi = document.getElementById('irParaApi').checked;
      const alerta = document.getElementById('alertaRegistro');

      if (senha !== confirmar) {
        alerta.textContent = 'As senhas digitadas não coincidem. Verifique e tente novamente.';
        alerta.classList.remove('hidden');
        return;
      }

      const usuarios = JSON.parse(localStorage.getItem('finpulse_users') || '[]');
      if (usuarios.some(u => u.email === email)) {
        alerta.textContent = 'Este e-mail já está cadastrado. Faça login ou utilize outro endereço.';
        alerta.classList.remove('hidden');
        return;
      }

      alerta.classList.add('hidden');
      usuarios.push({ nome, empresa, email, senha, criadoEm: new Date().toISOString() });
      localStorage.setItem('finpulse_users', JSON.stringify(usuarios));

      const sessao = {
        nome,
        empresa,
        email,
        autenticadoEm: new Date().toISOString()
      };
      localStorage.setItem('finpulse_session', JSON.stringify(sessao));

      const btn = document.getElementById('btnRegistrar');
      btn.textContent = 'Criando ambiente...';
      btn.disabled = true;

      setTimeout(() => {
        window.location.href = irParaApi ? 'settings.html' : 'index.html';
      }, 250);
    }
  </script>
</body>
</html>
