<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar • FinPulse Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Barra Superior Minimalista -->
  <header class="border-b border-slate-800/80 px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
          </svg>
        </div>
        <span class="text-lg font-bold tracking-tight text-white">FinPulse <span class="text-indigo-400 font-semibold">Analytics</span></span>
      </div>
      <a href="register.html" class="text-xs sm:text-sm font-medium text-slate-300 hover:text-white transition">
        Não tem conta? <span class="text-indigo-400 font-semibold">Criar conta</span>
      </a>
    </div>
  </header>

  <!-- Card Central de Autenticação -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
      <div class="px-8 pt-8 pb-6 border-b border-slate-100">
        <span class="inline-flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wider bg-indigo-50 text-indigo-700 border border-indigo-200 px-2.5 py-0.5 rounded-full">
          Acesso Executivo
        </span>
        <h1 class="text-2xl font-bold text-slate-900 mt-3">Entrar no Painel</h1>
        <p class="text-xs text-slate-500 mt-1">Acesse sua controladoria, DRE gerencial e integrações financeiras.</p>
      </div>

      <form id="formLogin" onsubmit="autenticarUsuario(event)" class="p-8 space-y-5">
        <div id="alertaLogin" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs px-3.5 py-2.5 rounded-lg"></div>

        <div>
          <label for="loginEmail" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">E-mail Corporativo</label>
          <input type="email" id="loginEmail" required placeholder="nome@empresa.com.br" class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition" />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="loginSenha" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Senha</label>
            <button type="button" onclick="preencherDemo()" class="text-[11px] font-medium text-indigo-600 hover:text-indigo-800">Usar conta demo</button>
          </div>
          <div class="relative">
            <input type="password" id="loginSenha" required minlength="6" placeholder="••••••••" class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 pr-10 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition" />
            <button type="button" onclick="alternarVisibilidadeSenha('loginSenha', this)" class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-600" aria-label="Mostrar senha">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs">
          <label class="inline-flex items-center gap-2 text-slate-600 cursor-pointer">
            <input type="checkbox" id="manterConectado" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" />
            <span>Manter sessão ativa neste navegador</span>
          </label>
        </div>

        <button type="submit" id="btnEntrar" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-2.5 px-4 rounded-lg transition shadow-md shadow-indigo-600/20">
          Entrar no Painel
        </button>

        <div class="pt-3 border-t border-slate-100 text-center text-xs text-slate-500">
          Ainda não possui cadastro empresarial?
          <a href="register.html" class="text-indigo-600 hover:text-indigo-800 font-semibold ml-1">Registrar nova conta</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-900">
    FinPulse Analytics • Controladoria &amp; Inteligência Financeira
  </footer>

  <script>
    function alternarVisibilidadeSenha(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      btn.classList.toggle('text-indigo-600', isPass);
    }

    function preencherDemo() {
      document.getElementById('loginEmail').value = 'controladoria@geotop.com.br';
      document.getElementById('loginSenha').value = 'demo123456';
    }

    function autenticarUsuario(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const senha = document.getElementById('loginSenha').value;
      const manter = document.getElementById('manterConectado').checked;
      const alerta = document.getElementById('alertaLogin');

      const usuarios = JSON.parse(localStorage.getItem('finpulse_users') || '[]');
      const usuarioEncontrado = usuarios.find(u => u.email === email && u.senha === senha);

      // Permite conta demo padrão ou usuário registrado localmente no protótipo
      let sessao = null;
      if (usuarioEncontrado) {
        sessao = {
          nome: usuarioEncontrado.nome,
          empresa: usuarioEncontrado.empresa,
          email: usuarioEncontrado.email,
          autenticadoEm: new Date().toISOString()
        };
      } else if (email === 'controladoria@geotop.com.br' && senha === 'demo123456') {
        sessao = {
          nome: 'Gestor Controladoria',
          empresa: 'GeoTop Engenharia & Topografia',
          email: email,
          autenticadoEm: new Date().toISOString()
        };
      } else {
        alerta.textContent = 'E-mail ou senha inválidos. Verifique seus dados, use a conta demo ou registre uma nova conta.';
        alerta.classList.remove('hidden');
        return;
      }

      alerta.classList.add('hidden');
      const storage = manter ? localStorage : sessionStorage;
      storage.setItem('finpulse_session', JSON.stringify(sessao));

      const btn = document.getElementById('btnEntrar');
      btn.textContent = 'Acessando painel...';
      btn.disabled = true;

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 250);
    }
  </script>
</body>
</html>
